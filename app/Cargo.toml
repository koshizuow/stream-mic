[package]
name = "stream-mic"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "Live-stream microphone processing: the engine, its page in a window (Tauri 2) and a tray icon"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
stream-mic-engine = { path = "../crates/engine" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
