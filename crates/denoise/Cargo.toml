[package]
name = "stream-mic-denoise"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "DeepFilterNet3 low latency model (libDF, tract), as a stream-mic stage"

[dependencies]
stream-mic-dsp = { path = "../dsp" }
# libDF at the same release as the plugin measured in design/measurements.md (MIT/Apache-2.0).
# default-model-ll embeds DeepFilterNet3_ll_onnx.tar.gz in the binary.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model-ll"] }
ndarray = "0.15"
