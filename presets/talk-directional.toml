# 說話（指向）: a cardioid or other directional mic (most USB and XLR mics) facing the mouth, the room mostly behind
# it. A little presence and air.
# Denoise is off by default (20 ms more delay; the expander handles the pauses, user 2026-11-07).
# Thresholds (exp, comp) are placeholders until auto setup (build-plan step 8) measures the room.
name = "talk-directional"
label = "說話（指向）"
about = "對著嘴的指向性麥克風（大多數 USB、XLR 麥）：清晰和空氣感各加一點"
follow_music = false

[knobs]
denoise = 0.0
body = 0.0
space = 0.0
sib = 50.0
gate = -54.0

[on]
denoise = false
eq = true
deess = true
exp = true
comp = true
verb = false
lim = true

[denoise]
limit = 6.0

[eq]
hp = 80.0
hp_base = 80.0
low = 0.0
pres = 1.5
air = 1.0

[deess]
thr = 7.0
freq = 7000.0
max = 12.0

[exp]
thr = -54.0
ratio = 2.5
range = 12.0
hold = 80.0
rel = 200.0

[comp]
thr = -24.0
ratio = 3.0
knee = 6.0
att = 10.0
rel = 120.0
makeup = 6.0

[verb]
style = "studio"
mix = 0.0
mix_dry = 0.0
follow = 1.5
size = 0.85
pre = 0.0
lowcut = 150.0
damp = 7000.0
er = 0.35
er_ms = 25.0

[lim]
ceil = -1.0
rel = 50.0
