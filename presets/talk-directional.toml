# 說話（指向）: a cardioid or other directional mic (most USB and XLR mics) facing the mouth, the room mostly behind
# it. A little presence and air.
# Denoise is off by default (20 ms more delay; the expander handles the pauses, user 2026-11-07).
# Thresholds (exp, comp) are placeholders until auto setup (build-plan step 8) measures the room.
name = "talk-directional"
label = "說話（指向）"
about = "對著嘴的指向性麥克風（大多數 USB、XLR 麥）：EQ 用「講話」（錄音師處理講話的平均：去悶、清晰、收一點高頻）"
follow_music = false

[knobs]
denoise = 0.0
body = 0.0
space = 0.0
sib = 50.0
gate = -54.0

[on]
denoise = false
lowcut = true
eq = true
deess = true
exp = true
comp = true
verb = false
lim = true

[denoise]
limit = 6.0

[lowcut]
freq = 90.0
base = 90.0

[eq]
low = 0.0
pres = 1.5
air = -2.5
style = "speech"
mid = -2.0
mid_f = 315.0
mid_q = 1.4
pres_f = 2500.0
pres_q = 0.7
hc = 20000.0
low_base = 0.0
pres_base = 1.5

[deess]
thr = 7.0
freq = 7000.0
max = 12.0

[exp]
thr = -54.0
ratio = 2.5
range = 12.0
hold = 80.0
rel = 200.0

[comp]
# the two-knob optical mode (the LA-2A model's curves): Amount and Makeup; Threshold lines the curve up (auto setup)
style = "two-knob"
two_knob = true
amount = 50.0
limit = false
auto_makeup = false
thr = -24.0
makeup = 6.0
ratio = 3.0
knee = 6.0
att = 80.0
rel = 39.0
rel2 = 720.0
slow = 31.0
memory = 50.0
auto_att = true

[verb]
style = "studio"
mix = 0.0
mix_dry = 0.0
follow = 1.5
size = 0.85
pre = 0.0
lowcut = 150.0
damp = 7000.0
er = 0.35
er_ms = 25.0

[lim]
ceil = -1.0
rel = 50.0
