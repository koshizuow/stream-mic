# 唱歌: no denoise (the speech models take held notes for noise, measurements.md), a slow shallow expander for note
# tails (exp_sing.py), gentler compression, and reverb that follows the backing track (a third of it a cappella).
# The reverb's style is Hall (TC-Helicon R1's table, crates/chain/src/preset.rs VERB_STYLES); Space sets how wet.
name = "sing"
label = "唱歌"
about = "不降噪，擴展器慢而淺，殘響跟著伴奏"
follow_music = true

[knobs]
denoise = 0.0
body = 20.0
space = 47.0
sib = 40.0
gate = -58.0

[on]
denoise = false
lowcut = true
eq = true
deess = true
exp = true
comp = true
verb = true
lim = true

[denoise]
limit = 6.0

[lowcut]
freq = 70.0
base = 70.0

[eq]
low = 1.0
pres = 1.0
air = 1.5

[deess]
thr = 8.5
freq = 7000.0
max = 10.0

[exp]
thr = -58.0
ratio = 1.7
range = 8.0
hold = 150.0
rel = 600.0

[comp]
# the two-knob optical mode (the LA-2A model's curves): Amount and Makeup; Threshold lines the curve up (auto setup)
style = "two-knob"
two_knob = true
amount = 50.0
limit = false
auto_makeup = false
thr = -22.0
makeup = 5.0
ratio = 2.5
knee = 6.0
att = 80.0
rel = 39.0
rel2 = 720.0
slow = 31.0
memory = 50.0
auto_att = true

[verb]
style = "hall"
mix = 14.0
mix_dry = 4.0
follow = 1.5
size = 1.8
pre = 25.0
lowcut = 150.0
damp = 6500.0
er = 0.35
er_ms = 45.0

[lim]
ceil = -1.0
rel = 60.0
