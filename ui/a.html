<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stream-mic</title>
<link rel="stylesheet" href="common.css">
<style>
main { max-width: 1240px; margin: 0 auto; padding: 16px 18px 40px; display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: stretch; }
/* both columns end on one line: the last card of each takes what is left */
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.col > :last-child { flex: 1; }

/* the device: mode screen, knobs, meters */
.device { display: grid; grid-template-columns: 220px 1fr 196px; align-items: stretch; gap: 18px; padding: 18px; background: linear-gradient(#1a1d22, #15181c); border: 1px solid var(--line); border-radius: 5px; box-shadow: 0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.05); }
/* the mode's display takes the height the panel has (set by the meters), its content centred in it */
.screen { flex: 1 1 auto; min-height: 150px; display: flex; flex-direction: column; justify-content: center; background: var(--inset); border: 1px solid #000; border-radius: 3px; padding: 14px 12px 10px; text-align: center; box-shadow: inset 0 2px 10px rgba(0,0,0,.6); }
.screen .icon { font-size: 34px; line-height: 1; color: var(--accent); text-shadow: 0 0 18px rgba(79,214,180,.45); margin: 6px 0 8px; }
.screen .mname { font-weight: 700; letter-spacing: .04em; }
.screen .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.screen .nav button { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 8px; }
.screen .nav button:hover { color: var(--text); }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: #333a43; }
.dots i.on { background: var(--accent); }
.about { color: var(--muted); font-size: 12.5px; margin: 10px 2px 12px; min-height: 2.6em; }
/* the left column's buttons sit on the panel's bottom line, as the knobs' and the meters' do */
.left { display: flex; flex-direction: column; }
.left .actions { margin-top: 0; }
.left .btn { width: 100%; margin-top: 8px; }
.left .note { margin-bottom: 0; }
.edited { font-size: 11px; color: var(--comp); margin-left: 6px; }

/* five knobs of one size in two centred rows, each in a cell of one height: names on one line */
/* two rows held together in the middle of the panel, not pushed to its top and bottom */
.knobs { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 22px 6px; }
.knob { flex: 0 0 calc((100% - 12px) / 3); max-width: 126px; height: 150px; align-content: start; }
/* one column the cell's width: a long value line (Gate's) must not widen it, and so its knob */
.knob { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 2px; user-select: none; touch-action: none; }
.knob svg { width: min(112px, 100%); height: auto; aspect-ratio: 1; cursor: ns-resize; }
.knob .kname { font-size: 13px; font-weight: 600; }
.knob .kval { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; justify-content: center; width: 100%; min-width: 0; }
.knob.dim .kname { color: var(--muted); }

.meters { display: grid; grid-template-rows: auto 1fr auto; gap: 8px; }
.meters .cbox { min-height: 230px; }
.lufs { text-align: center; }
.lufs b { font-size: 26px; font-weight: 700; display: block; line-height: 1.1; }
.lufs small { color: var(--muted); font-size: 11.5px; }
.lufs.good b { color: var(--accent); }
.lufs.low b { color: var(--gate); }
.lufs.high b { color: var(--comp); }

.chaincard .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.chaincard .head h2 { margin: 0; }
.detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.detail .dh { display: flex; align-items: center; gap: 10px; }
.detail .dh b { font-size: 14px; }
.detail .dh .spacer { flex: 1; }
.detail .dh label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.detail canvas { width: 100%; height: 190px; display: block; border-radius: 2px; margin-top: 10px; touch-action: none; }

@media (max-width: 1100px) {
  main { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .device { grid-template-columns: 1fr; }
  .col > :last-child { flex: none; }
  .meters .cbox { min-height: 200px; }
  .knobs { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 480px) {
  main { padding: 12px 12px 30px; }
  .knobs { grid-template-columns: repeat(2, 1fr); }
  .knob { flex-basis: 46%; max-width: none; height: 140px; }
  .knob svg { width: 90px; height: 90px; }
}
</style>
</head>
<body data-layout="a">
<header class="top">
  <span class="brand">stream-mic</span>
  <span class="chip ok" id="state"></span>
  <span class="chip" id="lufsChip"></span>
  <span class="chip" id="latChip"></span>
  <span class="chip" id="cpuChip">CPU</span>
  <span class="spacer"></span>
  <div class="seg layoutsw" id="layoutSw"><button data-v="a" data-i18n="sw_a"></button><button data-v="b" data-i18n="sw_b"></button></div>
  <button class="gear" id="gear" data-i18n-aria="settings" title="">⚙</button>
</header>
<div class="banner" id="banner" hidden></div>
<main>
  <div class="col">
    <section class="device">
      <div class="left">
        <div class="screen">
          <div class="icon" id="micon">◉</div>
          <div class="mname" id="mname"></div>
          <div class="nav"><button id="prev" data-i18n-aria="prev_mode">‹</button><div class="dots" id="dots"><i></i><i></i><i></i></div><button id="next" data-i18n-aria="next_mode">›</button></div>
        </div>
        <p class="about" id="about"></p>
        <div class="actions">
          <button class="btn bypass" id="bypass" aria-pressed="false" data-i18n="bypass"></button>
          <button class="btn" id="auto" data-i18n="auto"></button>
          <p class="note" data-i18n="space_hint"></p>
        </div>
      </div>
      <div class="knobs" id="knobs"></div>
      <div class="meters">
        <div id="bal"></div>
        <div class="cbox"><canvas id="meters"></canvas></div>
        <p class="note" style="text-align:center;margin:0" data-i18n="bal_hint"></p>
      </div>
    </section>

    <section class="card chaincard">
      <div class="head"><h2 data-i18n="chain"></h2><span class="note" style="margin:0" data-i18n="chain_note_a"></span></div>
      <div class="chain" id="chain"></div>
      <div class="detail" id="detail" hidden></div>
    </section>
  </div>
  <div class="col" id="side"></div>
</main>
<!-- the knobs' light, shared by every knob -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="kSkirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d434c"/><stop offset=".55" stop-color="#22262c"/><stop offset="1" stop-color="#121417"/></linearGradient>
  <radialGradient id="kCap" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#5b626c"/><stop offset=".45" stop-color="#2f343b"/><stop offset="1" stop-color="#181b1f"/></radialGradient>
  <linearGradient id="kRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></linearGradient>
  <radialGradient id="kGloss" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="kShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
</defs></svg>
<script src="app.js"></script>
</body>
</html>
