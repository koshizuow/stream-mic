[workspace]
resolver = "2"
members = ["crates/dsp", "crates/denoise", "crates/chain", "crates/cli", "crates/engine", "tools/pw-probe"]
# app/ (Tauri) keeps its own lock and build for now; it joins once it talks to the engine.
exclude = ["app"]
# engine and pw-probe need libpipewire headers; build them with build/linux.sh (the Ubuntu 24.04 image).
default-members = ["crates/dsp", "crates/denoise", "crates/chain", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[profile.release]
opt-level = 3
codegen-units = 1
